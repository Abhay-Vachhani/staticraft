{{ layout "layouts/base.html" }}

<section class="py-12 sm:py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <div class="max-w-3xl mb-12">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 border border-indigo-200 text-xs font-mono text-indigo-700 font-semibold mb-4">
                <span>Official Documentation</span>
            </div>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
                Staticraft <span class="indigo-gradient-text">Guides & API</span>
            </h1>
            <p class="text-slate-600 text-base leading-relaxed">
                Comprehensive documentation to build, scale, and secure event-driven static websites with zero public ports.
            </p>
        </div>

        <!-- Documentation Guides Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {{#each guides}}
            <a href="/docs/{{ slug }}" class="light-card p-6 sm:p-8 rounded-2xl light-card-hover flex flex-col justify-between group">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="px-2.5 py-1 rounded-md text-[11px] font-mono font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
                            {{ badge }}
                        </span>
                        <span class="text-xs font-mono text-slate-500">{{ readTime }}</span>
                    </div>
                    <h3 class="text-xl font-bold text-slate-900 group-hover:text-indigo-600 transition-colors mb-3">
                        {{ title }}
                    </h3>
                    <p class="text-xs text-slate-600 leading-relaxed mb-6">
                        {{ summary }}
                    </p>
                </div>

                <div class="flex items-center text-xs font-mono font-semibold text-indigo-600 group-hover:text-indigo-800 gap-1.5">
                    <span>Read Guide</span>
                    <span class="font-mono text-indigo-600 font-bold group-hover:translate-x-0.5 transition-transform">›</span>
                </div>
            </a>
            {{/each}}
        </div>

    </div>
</section>
