<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{#if title}}{{ title }} | Staticraft{{else}}Staticraft | Security-First Event-Driven Static Site Engine{{/if}}</title>
    <meta name="description" content="{{#if description}}{{ description }}{{else}}Generate privately. Serve statically. Update continuously. Security-first static site generator with zero exposed public app ports and zero npm dependencies.{{/if}}">
    <meta name="keywords" content="staticraft, ssg, static site generator, security-first, zero-dependency, node.js, static site engine, event-driven static site">
    <meta name="author" content="Abhay Vachhani">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="fJhZX0oQnmoFkkU0icXnGvDi37RmV5cKEXs2ePmYSAc" />
    <link rel="canonical" href="https://abhay-vachhani.github.io/staticraft/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- Open Graph / Facebook / WhatsApp Meta Tags -->
    <meta property="og:site_name" content="Staticraft Documentation">
    <meta property="og:type" content="website">
    <meta property="og:url" content="/">
    <meta property="og:title" content="{{#if title}}{{ title }}{{else}}Staticraft | Security-First Event-Driven Static Site Engine{{/if}}">
    <meta property="og:description" content="{{#if description}}{{ description }}{{else}}Generate privately. Serve statically. Update continuously. Security-first static site engine with zero exposed public app ports and zero npm dependencies.{{/if}}">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:secure_url" content="/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{#if title}}{{ title }}{{else}}Staticraft | Security-First Event-Driven Static Site Engine{{/if}}">
    <meta name="twitter:description" content="{{#if description}}{{ description }}{{else}}Generate privately. Serve statically. Update continuously. Security-first static site engine with zero exposed public app ports.{{/if}}">
    <meta name="twitter:image" content="/og-image.png">
    <meta name="twitter:creator" content="@AbhayVachhani">

    <!-- JSON-LD Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Staticraft",
      "operatingSystem": "Node.js (>=18.0.0)",
      "applicationCategory": "DeveloperApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Security-first, event-driven static site engine that renders HTML from templates and live data sources in an isolated background process.",
      "author": {
        "@type": "Person",
        "name": "Abhay Vachhani",
        "url": "https://github.com/Abhay-Vachhani"
      }
    }
    </script>

    <!-- Stylesheet (Asset hashed by Staticraft) -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white relative font-sans">
    
    <!-- Subtle Background Pattern -->
    <div class="fixed inset-0 pointer-events-none z-0 grid-pattern-light opacity-70"></div>

    <!-- Navigation Header -->
    {{ component "components/navbar.html" }}

    <!-- Main Content Slot -->
    <main class="flex-grow z-10">
        {{ slot }}
    </main>

    <!-- Footer -->
    {{ component "components/footer.html" }}

    <!-- Global Interactive Script -->
    <script>
        function copyToClipboard(text, elementId) {
            navigator.clipboard.writeText(text).then(() => {
                const el = document.getElementById(elementId);
                if (el) {
                    const original = el.innerText;
                    el.innerText = 'Copied!';
                    el.classList.add('text-emerald-600', 'font-bold');
                    setTimeout(() => {
                        el.innerText = original;
                        el.classList.remove('text-emerald-600', 'font-bold');
                    }, 2000);
                }
            });
        }
    </script>
</body>
</html>
